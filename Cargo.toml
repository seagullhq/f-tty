[package]
name = "ftty"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
gpui = "0.2.2"
portable-pty = "0.9"
vte = "0.13"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
strip = true

# Il binario di sviluppo non serve per distribuire: niente debug info,
# così target/ non esplode e le build restano più leggere.
[profile.dev]
debug = 0
