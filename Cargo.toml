[package]
name = "ftty"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
gpui = "0.2.2"
portable-pty = "0.9"
vte = "0.13"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
strip = true

# Development binary is not for distribution: no debug info, so target/
# does not balloon and builds stay lighter.
[profile.dev]
debug = 0
