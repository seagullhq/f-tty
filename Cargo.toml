[package]
name = "ftty"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"

[dependencies]
anyhow = "1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "f38d614b4b58bb44cc19d08ef5dd3efba918f9a3" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f38d614b4b58bb44cc19d08ef5dd3efba918f9a3", features = [
    "font-kit",
    "wayland",
    "x11",
    "runtime_shaders",
] }
portable-pty = "0.9"
vte = "0.13"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
strip = true

# Development binary is not for distribution: no debug info, so target/
# does not balloon and builds stay lighter.
[profile.dev]
debug = 0
